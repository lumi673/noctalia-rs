[package]
name = "noctalia-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Release performance harness for noctalia-rs"
publish = false

[[bin]]
name = "noctalia-bench"
path = "src/main.rs"

[dependencies]
chrono.workspace    = true
noctalia-rs.workspace          = true
noctalia-rs-build.workspace    = true
noctalia-rs-compiler.workspace = true
noctalia-rs-luau.workspace     = true
serde               = { workspace = true, features = ["derive"] }
serde_json.workspace = true
