[workspace]
members  = ["crates/*", "example", "template"]
resolver = "3"

[workspace.metadata.crane]
name = "noctalia_rs"

[workspace.package]
version      = "0.2.0"
edition      = "2024"
license      = "GPL-3.0-or-later"
repository   = "https://github.com/lumi673/noctalia-rs"
homepage     = "https://github.com/lumi673/noctalia-rs"

[workspace.dependencies]
chrono          = { version = "0.4.41", default-features = false, features = ["clock", "std"] }
noctalia-rs-build  = { path = "crates/build", version = "0.2.0" }
noctalia-rs-luau   = { path = "crates/luau", version = "0.2.0" }
noctalia-rs        = { path = "crates/lib", version = "0.2.0" }
noctalia-rs-macros = { path = "crates/macros", version = "0.2.0" }
proc-macro2     = "1.0.107"
quote           = "1.0.47"
serde           = { version = "1.0.229", features = ["derive"] }
serde_json      = "1.0.154"
syn             = { version = "3.0.10", features = ["full"] }
toml            = "0.8.2"
mlua             = { version = "0.10", features = ["luau", "vendored", "serialize", "send"] }

[workspace.lints.rust]
unsafe_code      = "deny"
unused_imports   = "deny"
unused_variables = "deny"
unused_mut       = "deny"
dead_code        = "deny"

[workspace.lints.clippy]
pedantic                      = { level = "deny", priority = -1 }
missing_errors_doc            = "allow"
missing_panics_doc            = "allow"
unwrap_used                   = "deny"
expect_used                   = "deny"
panic                         = "deny"
shadow_reuse                  = "deny"
todo                          = "deny"
unimplemented                 = "deny"
dbg_macro                     = "deny"
undocumented_unsafe_blocks    = "deny"
indexing_slicing              = "deny"
cast_possible_truncation      = "deny"
cast_sign_loss                = "deny"
cast_possible_wrap            = "deny"
cast_precision_loss           = "deny"
arithmetic_side_effects       = "deny"
multiple_unsafe_ops_per_block = "deny"
wildcard_imports              = "deny"
enum_glob_use                 = "deny"
unused_result_ok              = "deny"
absolute_paths                = "deny"
allow_attributes              = "deny"
unsafe_derive_deserialize     = "deny"
cast_ptr_alignment            = "deny"
result_unit_err               = "deny"
or_fun_call                   = "deny"
expect_fun_call               = "deny"
cast_lossless                 = "deny"
vec_resize_to_zero            = "deny"
clone_on_ref_ptr              = "deny"
rc_buffer                     = "deny"
arc_with_non_send_sync        = "deny"
wildcard_enum_match_arm       = "deny"
match_same_arms               = "deny"
single_match_else             = "deny"
missing_const_for_fn          = "deny"
redundant_pub_crate           = "deny"
option_if_let_else            = "deny"
needless_pass_by_ref_mut      = "deny"
integer_division              = "deny"
use_self                      = "deny"
redundant_clone               = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
